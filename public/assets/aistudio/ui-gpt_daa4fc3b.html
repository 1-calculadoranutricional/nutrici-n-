<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Menú Touch Deslizante</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      overflow-x: hidden;
      height: 100%;
      touch-action: pan-y;
    }

    #envoltorio {
      positiorelative;
      width: 100%;
      height: 100%;
      transform: translateX(0);
      transition: transform 0.2s ease;
      will-change: transform;
      z-index: 1200;
    }

    .barra-superior {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: white;
      z-index: 1400;
    }

    .boton-menu {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 24px;
      height: 24px;
      padding: 0;
    }

    .boton-menu span {
      height: 2px;
      background-color: #444;
      border-radius: 9999px;
    }

    .boton-menu span:nth-child(1) { width: 17px; }
    .boton-menu span:nth-child(2) { width: 12px; }

    .titulo-principal {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 700;
      font-size: 16px;
      white-space: nowrap;
      pointer-events: none;
    }

    .menu-lateral {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: white;
      z-index: 1400;
      transform: translateX(-100%);
      transition: transform 0.2s ease, width 0.2s ease;
      pointer-events: none;
      overflow-y: auto;
    }

    .menu-lateral.estado-290 {
      width: 290px;
      pointer-events: auto;
      transform: translateX(0);
    }

    .menu-lateral.estado-100 {
      width: 100vw;
      pointer-events: auto;
      transform: translateX(0);
    }

    .menu-lateral ul {
      list-style: none;
    }

    .menu-lateral a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      font-weight: 700;
      font-size: 15px;
      color: #111;
      text-decoration: none;
    }

    .menu-lateral a:hover {
      background-color: #eee;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1350;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .overlay.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div id="menuLateral" class="menu-lateral">
    <ul>
      <li><a href="#">🏠 Inicio</a></li>
      <li><a href="#">👤 Perfil</a></li>
      <li><a href="#">⚙️ Configuración</a></li>
    </ul>
  </div>

  <div id="overlay" class="overlay"></div>

  <div id="envoltorio">
    <div class="barra-superior">
      <button id="abrirMenu" class="boton-menu">
        <span></span>
        <span></span>
      </button>
      <div class="titulo-principal">Calculadora Nutricional</div>
    </div>
    <div id="contenedor-comidas"></div>
  </div>

<script>
    const menu = document.getElementById('menuLateral');
const envoltorio = document.getElementById('envoltorio');
const overlay = document.getElementById('overlay');
const boton = document.getElementById('abrirMenu');

const anchoMenu = 290;
const sensibilidad = 50;
let startX = 0;
let startY = 0;
let currentX = 0;
let isDragging = false;
let haDetectadoDireccion = false;
let estadoMenu = 0;

function actualizarOverlayOpacidad(x) {
  const progreso = Math.min(1, Math.max(0, x / anchoMenu));
  overlay.style.opacity = progreso;
  
  // Sombra lateral progresiva
  const alpha = 0.3 * progreso;
  const blur = 10 * progreso;
  const spread = 5 * progreso;
  menu.style.boxShadow = `2px 0 ${blur}px ${spread}px rgba(0, 0, 0, ${alpha})`;
  
  if (progreso > 0) {
    overlay.style.pointerEvents = 'auto';
    if (!overlay.classList.contains('visible')) {
      overlay.classList.add('visible');
    }
  } else {
    overlay.style.pointerEvents = 'none';
    overlay.classList.remove('visible');
  }
}

function setPositions(x) {
  let min = 0;
  let max = anchoMenu;
  
  if (estadoMenu === 2) {
    min = anchoMenu;
    max = anchoMenu;
  }
  
  const clamped = Math.max(min, Math.min(max, x));
  envoltorio.style.transform = `translateX(${clamped}px)`;
  menu.style.transform = `translateX(${clamped - anchoMenu}px)`;
  actualizarOverlayOpacidad(clamped);
}

function setMenuState(estado) {
  estadoMenu = estado;
  menu.classList.remove('estado-290', 'estado-100');
  
  if (estado === 1) menu.classList.add('estado-290');
  if (estado === 2) menu.classList.add('estado-100');
  
  requestAnimationFrame(() => {
    envoltorio.style.transition = 'transform 0.2s ease';
    menu.style.transition = 'transform 0.2s ease, width 0.2s ease';
    
    if (estado === 0) {
      envoltorio.style.transform = `translateX(0)`;
      menu.style.transform = `translateX(-100%)`;
      overlay.style.opacity = 0;
      overlay.style.pointerEvents = 'none';
      overlay.classList.remove('visible');
      menu.style.boxShadow = 'none';
      document.body.style.overflow = '';
    } else if (estado === 1) {
      envoltorio.style.transform = `translateX(${anchoMenu}px)`;
      menu.style.transform = `translateX(0)`;
      overlay.style.opacity = 1;
      overlay.style.pointerEvents = 'auto';
      overlay.classList.add('visible');
      actualizarOverlayOpacidad(anchoMenu); // 🟢 aplica sombra al abrir con botón
      document.body.style.overflow = 'hidden';
    } else if (estado === 2) {
      envoltorio.style.transform = `translateX(${window.innerWidth}px)`;
      menu.style.transform = `translateX(0)`;
      overlay.style.opacity = 1;
      overlay.style.pointerEvents = 'auto';
      overlay.classList.add('visible');
      actualizarOverlayOpacidad(window.innerWidth); // 🟢 sombra para full width
      document.body.style.overflow = 'hidden';
    }
  });
}

boton.addEventListener('click', () => {
  if (estadoMenu === 0) setMenuState(1);
  else setMenuState(0);
});

overlay.addEventListener('click', () => {
  setMenuState(0);
});

document.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  currentX = startX;
  isDragging = true;
  haDetectadoDireccion = false;
  
  envoltorio.style.transition = 'none';
  menu.style.transition = 'none';
});

document.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  
  const touch = e.touches[0];
  const deltaX = touch.clientX - startX;
  const deltaY = touch.clientY - startY;
  
  if (!haDetectadoDireccion) {
    if (Math.abs(deltaY) > Math.abs(deltaX)) {
      isDragging = false;
      return;
    }
    haDetectadoDireccion = true;
  }
  
  currentX = touch.clientX;
  
  if (estadoMenu === 0 || (estadoMenu === 1 && deltaX < 0)) {
    let desplazamiento = 0;
    if (estadoMenu === 1) {
      desplazamiento = Math.max(0, Math.min(anchoMenu, anchoMenu + deltaX));
    } else {
      desplazamiento = Math.max(0, Math.min(anchoMenu, deltaX));
    }
    
    envoltorio.style.transform = `translateX(${desplazamiento}px)`;
    menu.style.transform = `translateX(${desplazamiento - anchoMenu}px)`;
    menu.style.width = `${anchoMenu}px`;
    actualizarOverlayOpacidad(desplazamiento);
    return;
  }
  
  if (estadoMenu === 1 || estadoMenu === 2) {
    const base = estadoMenu === 1 ? anchoMenu : window.innerWidth;
    let desplazamiento = base + deltaX;
    
    desplazamiento = Math.max(anchoMenu, Math.min(window.innerWidth, desplazamiento));
    
    envoltorio.style.transform = `translateX(${desplazamiento}px)`;
    menu.style.transform = `translateX(0)`;
    menu.style.width = `${desplazamiento}px`;
    
    actualizarOverlayOpacidad(desplazamiento);
  }
});

document.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  
  envoltorio.style.transition = 'transform 0.2s ease';
  menu.style.transition = 'width 0.2s ease';
  
  const finalX = parseFloat(envoltorio.style.transform.replace('translateX(', '').replace('px)', ''));
  const umbral = (window.innerWidth + anchoMenu) / 2;
  const delta = currentX - startX;
  
  if ((estadoMenu === 1 || estadoMenu === 2) && finalX >= anchoMenu) {
    if (finalX >= umbral) {
      estadoMenu = 2;
      menu.style.width = `${window.innerWidth}px`;
      envoltorio.style.transform = `translateX(${window.innerWidth}px)`;
      actualizarOverlayOpacidad(window.innerWidth);
    } else {
      estadoMenu = 1;
      menu.style.width = `${anchoMenu}px`;
      envoltorio.style.transform = `translateX(${anchoMenu}px)`;
      actualizarOverlayOpacidad(anchoMenu);
    }
  } else if (estadoMenu === 1 && finalX < anchoMenu) {
    if (delta < -sensibilidad) {
      setMenuState(0);
    } else {
      setMenuState(1);
    }
  } else if (estadoMenu === 0) {
    if (delta > sensibilidad && currentX > 50) {
      setMenuState(1);
    } else {
      setMenuState(0);
    }
  }
  
  // 🔴 Asegura limpiar sombra si terminó en estado 0
  if (estadoMenu === 0) {
    menu.style.boxShadow = 'none';
  }
  
  startX = 0;
  currentX = 0;
});
</script>

</body>
</html>
